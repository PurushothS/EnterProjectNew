name: Playwright quality gate
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      BASE_URL: https://www.saucedemo.com
      API_BASE_URL: https://jsonplaceholder.typicode.com
      TEST_ID_ATTRIBUTE: data-test
      # Public SauceDemo example credentials; replace with secrets in product repositories.
      TEST_USERNAME: standard_user
      TEST_PASSWORD: secret_sauce
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:smoke
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: |
            allure-report/
            allure-results/
          if-no-files-found: ignore
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Prepare Allure report
        if: always()
        id: prepare_allure
        shell: bash
        run: |
          if [ -d allure-report ]; then
            zip -qr allure-report.zip allure-report
            echo "report_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "report_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Allure test result email
        if: always() && steps.prepare_allure.outputs.report_exists == 'true'
        uses: dawidd6/action-send-mail@v5
        with:
          server_address: ${{ vars.SMTP_HOST }}
          server_port: ${{ vars.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ vars.EMAIL_FROM }}
          to: ${{ vars.EMAIL_TO }}
          subject: 'Playwright tests ${{ job.status }} - ${{ github.repository }}'
          html_body: |
            <h2>Test result: ${{ job.status }}</h2>
            <p>The Allure report is attached.</p>
            <p>
              <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                View the GitHub Actions run
              </a>
            </p>
          attachments: allure-report.zip
